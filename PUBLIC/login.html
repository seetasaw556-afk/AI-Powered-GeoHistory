<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - GeoHistory</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #222;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #222;
        }

        .login-container {
            width: 360px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #722f37;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            GeoHistory
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="pages/places.html">Explore Places</a>
            <a href="pages/map.html">Map</a>
            <a href="pages/assistant.html">AI Assistant</a>
        </div>

    </nav>


    <div class="login-container">

        <h1>Login</h1>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>


    <script src="../js/auth.js"></script>

</body>
</html>
<p id=""message"></p>
<p style="text-align: center; margin-top: 20px;">
    Don't have an account?
    <a href="pages/register.html"
       style="color: #722f37; font-weight: bold; text-decoration: none;">
        Register
    </a>
</p>
